# =============================================================================
# R-001：本机小规模跑通验证（RTX 3090 24G）
# =============================================================================
# 目的（用户已定案的三段式的第一段）：**本机先跑小规模，验证收敛与显存，再上云**。
#   1. 管线能端到端跑完（数据 → 模型 → loss → 反传 → 落盘 → 出图）
#   2. loss 确实在下降（不是 NaN、不是平的）
#   3. 显存峰值 + 单 epoch 耗时 → 用来推算全量训练的时间与云端规格
#
# ⚠️ 本 config 产出的数字**一律不得进论文**。
#    数据量 limit=2000（占全量 2.9%）、epochs=5，
#    这个规模不足以支撑任何性能结论，只用于验证工程正确性。
#    对应 EXPERIMENT_LOG 中的定位是「冒烟」，不是「结果」。
#
# 与 B-001 的差异仅在规模项（data.limit / epochs / batch_size），
# 网络与损失配置完全一致 —— 这样冒烟通过后，改回 B-001 只动这三个数。
# =============================================================================

out_dir: runs/R001_local_smoke
seed: 20260811
device: null

epochs: 5
batch_size: 16                  # 3090 24G 上先保守，实测显存后再往上顶
lr: 0.001
lr_step: 20
lr_decay: 0.7
betas: [0.9, 0.999]
grad_clip: null

eval_every: 1
dump_cloud_every: 2             # 小规模跑，存密一点，方便肉眼查图
n_fixed_samples: 3

data:
  source: pu1k
  up_ratio: 4
  noise_beta: 0.0
  augment: true
  limit: 2000                   # 小规模
  val_ratio: 0.05

model:
  up_ratio: 4
  dims: [32, 64, 128, 256, 256]
  k: 20
  psi: 4
  head_dim: 32
  mlp_ratio: 1
  use_geo: true
  use_feat: true
  attention_type: sc-msa
  tail_mode: shuffle
  scale_qk: false

gan_mode: hinge
d_steps: 1
loss:
  w_cd: 1.0
  w_adv: 0.0
  w_uniform: 0.0
  w_repulsion: 0.0
  squared_cd: true
  adaptive_adv: false
  adv_warmup_epochs: 0
  adv_ramp_epochs: 10
  adv_target_ratio: 0.1
