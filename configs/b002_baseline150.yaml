# =============================================================================
# B-002：PU-Transformer baseline @150 epoch（8 组消融的正式对照组）
# =============================================================================
# 与 B-001 的唯一差别：epochs 100 -> 150，lr_step 20 -> 30。
# 其余全部逐字照抄 B-001（loss 只开 CD、四项改进全关），仍是干净对照组。
#
# -----------------------------------------------------------------------------
# 为什么要重跑 150（依据已修正，见 docs/EXPERIMENT_LOG.md「收敛判据的窗口敏感性」）
# -----------------------------------------------------------------------------
# B-001 实测（scripts/check_convergence_sensitivity.py，5 个窗口宽度全扫）：
#   HD  : 5/5 窗口一致判定未收敛，ep70-99 斜率 -2.71%/10ep   <- 稳健，主依据
#   NUC : 窗口判定翻转，但 ep70-99 斜率 -2.00%/10ep          <- 次依据
#   CD  : 已进入噪声平台（W=20/25 变化为 +0.69% / +1.44%）    <- 多跑无损无益
# 即：为 HD / NUC 争取收敛空间，CD 不受损。
#
# ⚠️ 不是原先声称的「三项都未收敛」—— 那个说法基于手挑窗口，已推翻。
#
# -----------------------------------------------------------------------------
# lr_step 为何同步 20 -> 30（关键，别改回去）
# -----------------------------------------------------------------------------
# B-001: 100 epoch / step 20 -> 衰减 5 档，末段 lr = 1e-3 x 0.7^5 = 1.6807e-4
# 若 150 epoch 仍用 step 20 -> 衰减 7 档，末段 lr = 1e-3 x 0.7^7 = 8.24e-5
#   => 学习率曲线形状变了，B-002 与 B-001 的差异将混入「lr 更小」这一混杂因子，
#      无法归因到「训练更久」。
# 取 step 30 -> 150/30 = 5 档，与 B-001 档数一致，末段 lr 同为 1.6807e-4，
# 仅把每档拉长 1.5 倍。这是唯一能保持可比性的取法。
#
# -----------------------------------------------------------------------------
# 选点：多指标综合（定案 2026-08-11）
# -----------------------------------------------------------------------------
# 在 B-001 上与 cd-only 完全等价（同选 ep41，三项逐位一致），故对 baseline 零代价；
# 采用它是为改进 B（自适应对抗）/ C（uniform 项）两组做前瞻防护 —— 那两组
# 直接冲着 NUC/HD 优化，三指标很可能真错开。
# 训练脚本同时落盘 cd-only 影子对照，若两准则分歧会打印 ★ 并写入 summary_stats.json。
# =============================================================================

out_dir: runs/B002_baseline150
seed: 20260811                  # 与 B-001 同种子，隔离 epoch 数这一单一变量

epochs: 150                     # B-001 为 100
batch_size: 64
lr: 0.001
lr_step: 30                     # B-001 为 20；同比放大保持 5 档衰减
lr_decay: 0.7
betas: [0.9, 0.999]
grad_clip: null
device: null

eval_every: 1
dump_cloud_every: 10            # 150/10 = 15 组快照（B-001 为 10 组）
n_fixed_samples: 3

# --- 选点与报数 ---
select_weights: {cd: 0.5, hd: 0.2, nuc: 0.3}
select_warmup: 5                # 前 5 epoch 不出 best（running median 未稳）
plateau_frac: 0.5               # 后 50% epoch（ep75-149）为平台区，主表报其均值±σ

data:
  source: pu1k
  up_ratio: 4
  noise_beta: 0.0
  augment: true
  limit: null
  val_ratio: 0.05

model:
  up_ratio: 4
  dims: [32, 64, 128, 256, 256]
  k: 20
  psi: 4
  head_dim: 32
  mlp_ratio: 1
  use_geo: true
  use_feat: true
  attention_type: sc-msa
  tail_mode: shuffle
  scale_qk: false               # 干净对照：改进 D 关闭

# 干净对照：判别器不建，全部对抗相关项为 0
gan_mode: hinge
d_steps: 1
loss:
  w_cd: 1.0
  w_cd_fwd: 1.0                # 改进 A 关闭（1.0/1.0 = 原始对称 CD，逐位等价）
  w_cd_bwd: 1.0
  w_adv: 0.0                   # 改进 B 关闭
  w_uniform: 0.0               # 改进 C 关闭
  w_repulsion: 0.0
  squared_cd: true
  adaptive_adv: false
  adv_warmup_epochs: 0
  adv_ramp_epochs: 10
  adv_target_ratio: 0.1
